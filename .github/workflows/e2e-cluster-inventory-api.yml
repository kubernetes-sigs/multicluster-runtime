name: E2E - Cluster Inventory API Example

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-cluster-inventory-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-cluster-inventory-api:
    name: Run cluster-inventory-api example
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # tag=v7.0.1
    - name: Calculate go version
      id: vars
      run: echo "go_version=$(make go-version)" >> $GITHUB_OUTPUT
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # tag=v7.0.0
      with:
        go-version: ${{ steps.vars.outputs.go_version }}
    - name: Set up kind
      uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # tag=v1.15.0
      with:
        install_only: true
        version: v0.31.0
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # tag=v4.3.0
    - name: Tool versions
      run: |
        docker version
        kind version
        kubectl version --client=true
        go version
    - name: Run e2e
      run: MAKEFLAGS="-s" make test-e2e-cluster-inventory-api
    - name: Cleanup kind clusters
      if: always()
      run: bash ./examples/cluster-inventory-api/down.sh
